<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Screen Joke Pro</title>
    <style>
        /* CSS Variables for Clean UI Switching */
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --header-bg: #292929;
            --text-color: #ffffff;
            --border-color: #383838;
            --joke-size: 1.35rem;
        }

        body.light-theme {
            --bg-color: #f0f2f5;
            --container-bg: #ffffff;
            --header-bg: #e4e6eb;
            --text-color: #1c1e21;
            --border-color: #ccd0d5;
        }

        body.f-small { --joke-size: 1.1rem; }
        body.f-med { --joke-size: 1.35rem; }
        body.f-large { --joke-size: 1.65rem; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 0.2s, color 0.2s;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            background: var(--container-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }

        .app-header {
            padding: 12px 15px;
            background: var(--header-bg);
            display: flex;
            justify-content: flex-end; 
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cat-dropdown {
            background: var(--container-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .settings-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-color);
        }

        .settings-popup {
            position: absolute;
            top: 55px;
            right: 15px;
            width: 220px;
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 100;
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .settings-popup.open { display: flex; }

        .popup-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .toggle-opt-btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .card-display-zone {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-joke-card {
            width: 100%;
            min-height: 280px;
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            position: relative;
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
            transition: background 0.3s ease;
        }

        .joke-text-content {
            font-size: var(--joke-size);
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .card-utilities {
            display: flex;
            gap: 12px;
        }

        .utility-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .counter-badge {
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 0.75rem;
            background: rgba(0,0,0,0.25);
            padding: 3px 8px;
            border-radius: 8px;
        }

        .app-footer {
            padding: 15px;
            background: var(--header-bg);
            display: flex;
            justify-content: space-between;
            gap: 12px;
            border-top: 1px solid var(--border-color);
        }

        .footer-nav-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .footer-nav-btn:active { transform: scale(0.96); }

        .btn-red { background: #e53935; } 
        
        .btn-palette { 
            background: linear-gradient(45deg, #f44336, #3f51b5, #4caf50, #ffeb3b); 
            max-width: 55px; 
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .toast-popup {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: none;
            z-index: 200;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="app-header">
            <div class="header-controls">
                <select class="cat-dropdown" id="catMenu">
                    <option value="all">All Jokes</option>
                    <option value="puns">Witty Puns</option>
                    <option value="animal">Animal Jokes</option>
                    <option value="tech">Tech Humor</option>
                    <option value="family">Family Jokes</option>
                </select>
                <button class="settings-btn" id="gearMenuBtn">⚙️</button>
            </div>
        </div>

        <div class="settings-popup" id="settingsBox">
            <div class="popup-row">
                <span>App Theme:</span>
                <button class="toggle-opt-btn" id="themeToggleAction">🌙 Dark</button>
            </div>
            <div class="popup-row">
                <span>Font Size:</span>
                <button class="toggle-opt-btn" id="sizeToggleAction">Medium</button>
            </div>
        </div>

        <div class="card-display-zone">
            <div class="main-joke-card" id="jokeWindow">
                <div class="counter-badge" id="jokeCountIndicator">1 / 32</div>
                <div class="joke-text-content" id="jokeTextString">Loading...</div>
                
                <div class="card-utilities">
                    <button class="utility-btn" id="clipboardAction">📋 Copy</button>
                </div>
            </div>
        </div>

        <div class="app-footer">
            <button class="footer-nav-btn btn-red" id="prevActionBtn">⬅️ Prev</button>
            <button class="footer-nav-btn btn-palette" id="colorChangeBtn" title="Change Card Color">🎨</button>
            <button class="footer-nav-btn btn-red" id="nextActionBtn">Next ➡️</button>
        </div>

        <div class="toast-popup" id="alertToast">Copied!</div>
    </div>

    <script>
        const fullDatabase = [
            // --- WITTY PUNS (8 Brand New Jokes) ---
            { id: 1, text: "What do you hear when you put your ear against a wall?\n\nYour neighbor putting their ear against the wall even harder!", category: "puns" },
            { id: 2, text: "Why do parallel lines never meet each other?\n\nBecause they have no Common Connection or link—they stay single forever!", category: "puns" },
            { id: 3, text: "What did the number 0 say to the number 8?\n\n\"Wow, that is a really nice belt you have around your waist!\"", category: "puns" },
            { id: 4, text: "Why is a geometry book always so depressed?\n\nBecause its life is filled with way more Problems than ours!", category: "puns" },
            { id: 5, text: "Which thief never goes to jail?\n\nThe one who steals your heart and your sleep at night!", category: "puns" },
            { id: 6, text: "Why do shoes always stay under a person's feet?\n\nBecause they know if they sit on someone's head, neither the person nor the shoe will have any respect left!", category: "puns" },
            { id: 7, text: "Which key cannot open a single lock?\n\nThe Enter key on your keyboard—it only takes you to a new line or submits your work!", category: "puns" },
            { id: 8, text: "What is a web designer's favorite text style?\n\nBold, because they never like to take the crooked or italic path in life!", category: "puns" },

            // --- ANIMAL JOKES (8 Brand New Jokes) ---
            { id: 9, text: "Why do bees always keep their hair so neat and perfectly styled?\n\nBecause they always use a Honey-comb!", category: "animal" },
            { id: 10, text: "Why does a mosquito sing a song right after biting you?\n\nBecause after drinking your blood, its \"Blood Group\" turns into a music band!", category: "animal" },
            { id: 11, text: "Why are dogs terrible drivers?\n\nBecause instead of stopping at a red light, they just start Barking at it!", category: "animal" },
            { id: 12, text: "Which bird studies the most?\n\nAn Owl, because it stays up all night like a student the day before an exam!", category: "animal" },
            { id: 13, text: "Why can't an elephant type on a computer?\n\nBecause with just a single click of its foot, the entire keyboard gets Formatted!", category: "animal" },
            { id: 14, text: "Why do cats absolutely love playing video games?\n\nBecause they don't just have one, they have 9 Lives to spare!", category: "animal" },
            { id: 15, text: "What do you call a penguin in the desert?\n\nLost!", category: "animal" },
            { id: 16, text: "What do you call a dinosaur that crashes his car?\n\nTyrannosaurus Wrecks!", category: "animal" },

            // --- TECH HUMOR (8 Brand New Jokes) ---
            { id: 17, text: "What is the real difference between Windows and an Apple?\n\nWhen you touch Windows, you get a cool breeze. When you touch an Apple, you get an empty pocket!", category: "tech" },
            { id: 18, text: "What is the true definition of a \"Loop\"?\n\nFixing GitHub code from morning till night, and then seeing the exact same code in your dreams!", category: "tech" },
            { id: 19, text: "What do a road without traffic signals and code without comments have in common?\n\nA major crash can happen at any given moment!", category: "tech" },
            { id: 20, text: "What is the difference between Google's memory and human memory?\n\nIf you forget your password, Google can recover it. But you can never recover from your own past mistakes!", category: "tech" },
            { id: 21, text: "Why did the programmer quit his job?\n\nBecause his boss refused to increase his salary based on an Array index!", category: "tech" },
            { id: 22, text: "Why does a clock hand never lazy?\n\nBecause it runs a Loop every second and has no delay in its backend!", category: "tech" },
            { id: 23, text: "Why do programmers prefer dark mode?\n\nBecause light attracts bugs!", category: "tech" },
            { id: 24, text: "Why do clouds come down to the ground as rain?\n\nBecause when the Cloud Storage gets completely full, it starts downloading the data!", category: "tech" },

            // --- FAMILY JOKES (8 Brand New Jokes) ---
            { id: 25, text: "Why do people cry while cutting onions?\n\nBecause before cutting, the Raw Code of the onion reflects straight into our eyes!", category: "family" },
            { id: 26, text: "Why is an egg always in a bad mood?\n\nBecause whenever someone enters its life, they either Boil it or Fry it!", category: "family" },
            { id: 27, text: "Why does coffee give you an instant energy boost?\n\nBecause coffee has Java installed in it by default!", category: "family" },
            { id: 28, text: "Which fruit is always single?\n\nA Pear, because there is absolutely no \"pair\" in its life!", category: "family" },
            { id: 29, text: "Why does a chocolate hate going to school?\n\nBecause it knows that as soon as it enters the classroom, everyone will divide it like Dairy Milk!", category: "family" },
            { id: 30, text: "What do you get when Oxygen and Magnesium go on a date?\n\nOMG! (Magnesium Oxide)", category: "family" },
            { id: 31, text: "Why does the Earth rotate in circles?\n\nBecause walking in a straight line with today's fuel prices is way out of its budget!", category: "family" },
            { id: 32, text: "Why is a library the biggest energy source on Earth?\n\nBecause the thoughts and ideas of thousands of people are hosted there together on a single Server!" }
        ];

        const colorPalette = ["#d32f2f", "#1976d2", "#388e3c", "#7b1fa2", "#c2185b", "#00796b", "#f57c00"];
        let activeColorIndex = 0; 

        let viewableList = [...fullDatabase];
        let pointerIndex = 0;

        const jokeWindow = document.getElementById('jokeWindow');
        const jokeTextString = document.getElementById('jokeTextString');
        const jokeCountIndicator = document.getElementById('jokeCountIndicator');
        const catMenu = document.getElementById('catMenu');
        const clipboardAction = document.getElementById('clipboardAction');
        const prevActionBtn = document.getElementById('prevActionBtn');
        const nextActionBtn = document.getElementById('nextActionBtn');
        const colorChangeBtn = document.getElementById('colorChangeBtn');
        const alertToast = document.getElementById('alertToast');
        const settingsBox = document.getElementById('settingsBox');
        const gearMenuBtn = document.getElementById('gearMenuBtn');
        const themeToggleAction = document.getElementById('themeToggleAction');
        const sizeToggleAction = document.getElementById('sizeToggleAction');

        function refreshDisplayScreen() {
            if (viewableList.length === 0) {
                jokeTextString.innerText = "No jokes available.";
                jokeWindow.style.background = "#444444";
                jokeCountIndicator.innerText = "0 / 0";
                clipboardAction.style.display = "none";
                prevActionBtn.disabled = true;
                nextActionBtn.disabled = true;
                prevActionBtn.style.opacity = "0.2";
                nextActionBtn.style.opacity = "0.2";
                return;
            }

            clipboardAction.style.display = "inline-block";

            const activeJoke = viewableList[pointerIndex];
            jokeTextString.innerText = activeJoke.text;
            
            jokeWindow.style.background = colorPalette[activeColorIndex];
            jokeCountIndicator.innerText = `${pointerIndex + 1} / ${viewableList.length}`;

            prevActionBtn.disabled = pointerIndex === 0;
            nextActionBtn.disabled = pointerIndex === viewableList.length - 1;

            prevActionBtn.style.opacity = pointerIndex === 0 ? "0.2" : "1";
            nextActionBtn.style.opacity = pointerIndex === viewableList.length - 1 ? "0.2" : "1";
        }

        colorChangeBtn.onclick = function() {
            activeColorIndex = (activeColorIndex + 1) % colorPalette.length;
            jokeWindow.style.background = colorPalette[activeColorIndex];
        };

        gearMenuBtn.onclick = function(e) {
            e.stopPropagation();
            settingsBox.classList.toggle('open');
        };

        document.onclick = function() {
            settingsBox.classList.remove('open');
        };

        let activeThemeIsDark = true;
        themeToggleAction.onclick = function() {
            activeThemeIsDark = !activeThemeIsDark;
            if (activeThemeIsDark) {
                document.body.classList.remove('light-theme');
                themeToggleAction.innerText = "🌙 Dark";
                triggerToastAlert("Dark Mode Active");
            } else {
                document.body.classList.add('light-theme');
                themeToggleAction.innerText = "☀️ Light";
                triggerToastAlert("Light Mode Active");
            }
        };

        let textStateCycle = 1;
        sizeToggleAction.onclick = function() {
            textStateCycle = (textStateCycle + 1) % 3;
            document.body.classList.remove('f-small', 'f-med', 'f-large');
            
            if (textStateCycle === 0) {
                document.body.classList.add('f-small');
                sizeToggleAction.innerText = "Small";
            } else if (textStateCycle === 1) {
                document.body.classList.add('f-med');
                sizeToggleAction.innerText = "Medium";
            } else {
                document.body.classList.add('f-large');
                sizeToggleAction.innerText = "Large";
            }
        };

        catMenu.onchange = function(e) {
            const chosenFilter = e.target.value;
            if (chosenFilter === 'all') {
                viewableList = [...fullDatabase];
            } else {
                viewableList = fullDatabase.filter(item => item.category === chosenFilter);
            }
            pointerIndex = 0;
            refreshDisplayScreen();
        };

        nextActionBtn.onclick = function() {
            if (pointerIndex < viewableList.length - 1) { pointerIndex++; refreshDisplayScreen(); }
        };

        prevActionBtn.onclick = function() {
            if (pointerIndex > 0) { pointerIndex--; refreshDisplayScreen(); }
        };

        clipboardAction.onclick = function() {
            const activeJokeItem = viewableList[pointerIndex];
            if (!activeJokeItem) return;
            
            navigator.clipboard.writeText(activeJokeItem.text).then(() => {
                triggerToastAlert("Joke Copied to Clipboard! 📋");
            });
        };

        function triggerToastAlert(msg) {
            alertToast.innerText = msg;
            alertToast.style.display = "block";
            setTimeout(() => { alertToast.style.display = "none"; }, 2000);
        }

        refreshDisplayScreen();
    </script>
</body>
</html>
